name: Ontology Documentation (WIDOCO)

on:
  push:
    branches:
      - main
    paths:
      - 'radnetz_ontology.ttl'
      - '.widoco/**'
      - '.github/workflows/widoco-documentation.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache WIDOCO jar
        id: cache-widoco
        uses: actions/cache@v4
        with:
          path: .widoco/bin/widoco.jar
          key: widoco-1.4.25-jdk17

      - name: Download WIDOCO
        if: steps.cache-widoco.outputs.cache-hit != 'true'
        run: |
          mkdir -p .widoco/bin
          WIDOCO_VERSION="1.4.25"
          curl -sSfL "https://github.com/dgarijo/Widoco/releases/download/v${WIDOCO_VERSION}/widoco-${WIDOCO_VERSION}-jar-with-dependencies_JDK-17.jar" -o .widoco/bin/widoco.jar

      - name: Generate Documentation with WIDOCO
        run: |
          mkdir -p docs
          java -Djava.awt.headless=true -jar .widoco/bin/widoco.jar \
            -ontFile radnetz_ontology.ttl \
            -outFolder docs \
            -confFile .widoco/widoco.properties \
            -rewriteAll \
            -webVowl \
            -lang de-en \
            -includeAnnotationProperties

          # Ensure index.html exists for GitHub Pages root
          if [ ! -f docs/index.html ]; then
            if [ -f docs/index-de.html ]; then
              cp docs/index-de.html docs/index.html
            elif [ -f docs/index-en.html ]; then
              cp docs/index-en.html docs/index.html
            fi
          fi

          # Disable Jekyll processing on GitHub Pages
          touch docs/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

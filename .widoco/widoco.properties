abstract=Diese Ontologie beschreibt die Anforderungen und das Datenmodell f\u00FCr das Radnetz Deutschland (GDI-DE UP-3) sowie administrative Einheiten (Destatis GV2Q) im Rahmen der Geodateninfrastruktur Deutschland (GDI-DE) und des Bundesamtes f\u00FCr Logistik und Mobilit\u00E4t (BALM), harmonisiert mit GeoSPARQL, Simple Features, QUDT, W3C Time und INSPIRE Road Transport Network. / This ontology defines the German Cycling Network data model (GDI-DE UP-3) and administrative units (Destatis GV2Q) within the German Spatial Data Infrastructure (GDI-DE) and the Federal Office for Logistics and Mobility (BALM), aligned with GeoSPARQL, Simple Features, QUDT, W3C Time, and INSPIRE Road Transport Network.

